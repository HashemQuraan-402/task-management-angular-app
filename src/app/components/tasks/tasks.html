<app-add-task (onAddTask)="addTask($event)"></app-add-task>

<p *ngIf="tasks.length === 0" class="empty-state">
  No tasks yet. Select <strong>Add task</strong> to create your first one.
</p>

<app-task-item
  *ngFor="let task of tasks"
  [task]="task"
  (deleteTask)="deleteTask($event)"
  (toggleReminder)="toggleReminder($event)"
></app-task-item>
