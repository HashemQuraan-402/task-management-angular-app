<article class="task" [class.reminder]="task.reminder">
  <div class="task-copy">
    <h3>{{ task.text }}</h3>
    <p>{{ task.day }}</p>
  </div>

  <div class="task-actions">
    <button
      type="button"
      class="reminder-button"
      [attr.aria-pressed]="task.reminder"
      (click)="onToggleReminder()"
    >
      {{ task.reminder ? 'Reminder on' : 'Set reminder' }}
    </button>

    <button
      type="button"
      class="delete-button"
      [attr.aria-label]="'Delete ' + task.text"
      (click)="onDelete()"
    >
      <fa-icon [icon]="faTimes"></fa-icon>
    </button>
  </div>
</article>
